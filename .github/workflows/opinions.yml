name: Opinion slow fetch

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      startup:
        description: "1=app startup, force SCMP/UDN"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: opinion-slow-fetch
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch opinions
        env:
          STARTUP: ${{ github.event.inputs.startup }}
        run: python fetch_opinions.py

      - name: Commit opinion data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opinion_latest.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Update opinion data"
            for i in 1 2 3; do
              git push && break
              sleep 5
              git pull --rebase origin main || true
            done
          fi
