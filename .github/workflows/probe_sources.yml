name: Probe sources

on:
  push:
    paths:
      - probe_sources.py
      - .github/workflows/probe_sources.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Probe sources
        run: python probe_sources.py

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-results
          path: probe_results.json
          retention-days: 7
